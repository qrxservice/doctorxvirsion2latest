      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ---- QUEUE DISPLAY DEVICES ----
  /queue-display-devices/{id}:
    get:
      operationId: getQueueDevicePublic
      tags: [queue]
      summary: Get a queue display device by id (public, for TV/kiosk display)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueDisplayDevice'
    put:
      operationId: updateQueueDevice
      tags: [doctors]
      summary: Update a queue display device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueDisplayDeviceInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueDisplayDevice'
    delete:
      operationId: deleteQueueDevice
      tags: [doctors]
      summary: Delete a queue display device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted

  /doctor/queue-display-devices:
    get:
      operationId: getMyQueueDevices
      tags: [doctors]
      summary: Get own queue display devices (authenticated doctor)
      responses:
        '200':
          description: My queue display devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueDisplayDevice'
    post:
      operationId: createQueueDevice
      tags: [doctors]
      summary: Create a queue display device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueDisplayDeviceInput'
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueDisplayDevice'

